<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#232C36"/>
      <stop offset="100%" stop-color="#12171E"/>
    </radialGradient>
    <linearGradient id="kanjiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#55E6DE"/>
      <stop offset="100%" stop-color="#26C2BC"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Círculo principal -->
  <circle cx="256" cy="256" r="236" fill="url(#bgGrad)" stroke="#2F3B4B" stroke-width="14" filter="url(#shadow)"/>
  <circle cx="256" cy="256" r="226" fill="none" stroke="#3DD6D0" stroke-width="2" stroke-opacity="0.3"/>
  
  <!-- Kanji 夜 (Yoru / Yomori) -->
  <text x="50%" y="54%" 
        dominant-baseline="central" 
        text-anchor="middle" 
        fill="url(#kanjiGrad)" 
        font-family="'Yu Gothic', 'Meiryo', 'Noto Sans CJK JP', 'Microsoft YaHei', 'PingFang SC', sans-serif" 
        font-weight="900" 
        font-size="280px"
        letter-spacing="-2px">夜</text>
</svg>