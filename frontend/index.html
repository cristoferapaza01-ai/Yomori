<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Yomori - App de Manga, Manhwa y Novelas para Android</title>
    <meta name="description" content="Yomori es la app gratuita y sin anuncios de lectura de Manga y Manhwa para Android con sincronización en la nube y descargas offline." />
    <meta name="theme-color" content="#161D24" />
  </head>
  <body class="bg-[#090b0e] text-gray-100 antialiased m-0 p-0 overflow-x-hidden">
    <div id="root">
      <div style="display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;width:100vw;background-color:#07090e;font-family:system-ui,-apple-system,sans-serif;">
        <div style="width:64px;height:64px;border-radius:50%;background:#161D24;border:2px solid #2F3B4B;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px -5px rgba(0,0,0,0.7);margin-bottom:16px;">
          <span style="color:#3DD6D0;font-size:32px;font-weight:900;line-height:1;user-select:none;">夜</span>
        </div>
        <div style="font-size:18px;font-weight:900;letter-spacing:1px;color:#ffffff;margin-bottom:6px;">YOMORI</div>
        <div style="font-size:11px;font-weight:600;color:#6b7280;letter-spacing:0.5px;">Cargando tu biblioteca...</div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
